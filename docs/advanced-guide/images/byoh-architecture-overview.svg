<g class="line"><path d="M192 314V286"/><path d="M464 314V286"/><path d="M736 314V286"/><path d="M1008 314V286"/></g>
<rect x="220" y="432" width="760" height="68" rx="14" fill="#e5faf6" stroke="#80d7ca" stroke-width="2"/><text x="600" y="458" text-anchor="middle" class="b">BYOH Host Capacity Pool</text><text x="600" y="482" text-anchor="middle" class="s">Namespace-scoped ByoHost resources · available and assigned capacity</text><path d="M464 396V432" class="line" marker-end="url(#a)"/>
