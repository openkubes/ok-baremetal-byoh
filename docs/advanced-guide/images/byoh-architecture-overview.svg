<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">OpenKubes BYOH Architecture Overview</title><desc id="desc">Operators use Kubernetes APIs in the management cluster. Cluster API, BYOH controllers, runtime extension and safety guard coordinate registered hosts. Agents execute host operations on existing virtual or physical hosts running workload cluster nodes.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#10254d}.h{font-size:24px;font-weight:700}.b{font-size:19px;font-weight:700}.s{font-size:15px;fill:#49627a}.l{font-size:14px;fill:#246ba7}.line{fill:none;stroke:#2580d8;stroke-width:2.5;stroke-linejoin:round}.dash{fill:none;stroke:#159e9d;stroke-width:2.5;stroke-dasharray:7 5}</style><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2580d8"/></marker><marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#159e9d"/></marker></defs>
<rect width="1200" height="820" fill="#fff"/><path d="M1200 0H1100Q1120 65 1200 90Z" fill="#d3f8f2"/><path d="M0 820V740Q70 760 110 820Z" fill="#d3f8f2"/>
<text x="600" y="43" text-anchor="middle" font-size="30" font-weight="700">OpenKubes BYOH Architecture</text><text x="600" y="72" text-anchor="middle" class="s">Native Cluster API integration with controlled host-level lifecycle execution</text>
<rect x="385" y="96" width="430" height="55" rx="13" fill="#f1f8ff" stroke="#8fc6f5"/><text x="600" y="119" text-anchor="middle" class="b">Platform Operator / Automation</text><text x="600" y="139" text-anchor="middle" class="s">kubectl · clusterctl · declarative YAML</text><path d="M600 151V180" class="line" marker-end="url(#a)"/>
<rect x="42" y="183" width="1116" height="342" rx="20" fill="#f3f9ff" stroke="#91c5ef" stroke-width="2"/><text x="68" y="216" class="h">Management Cluster</text><text x="1130" y="215" text-anchor="end" class="s">Desired state and lifecycle coordination</text>
<rect x="68" y="236" width="1064" height="50" rx="10" fill="#fff" stroke="#91c5ef"/><text x="600" y="267" text-anchor="middle" class="b">Kubernetes API · Cluster API and BYOH resources</text>
<g stroke="#a4c9ec" fill="#fff"><rect x="68" y="314" width="248" height="82" rx="12"/><rect x="340" y="314" width="248" height="82" rx="12"/></g><g fill="#e9fbf8" stroke="#80d7ca"><rect x="612" y="314" width="248" height="82" rx="12"/><rect x="884" y="314" width="248" height="82" rx="12"/></g>
