<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 561" role="img" aria-labelledby="title desc"><title id="title">Management Cluster Bootstrap</title><desc id="desc">Management cluster bootstrap shown as logical layers: local kind or existing Kubernetes, the native Cluster API foundation, OpenKubes BYOH, and optional lifecycle extensions.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#438fc2"/></marker></defs><rect width="1000" height="561" rx="18" fill="#f5fbfd"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="43" font-size="30" font-weight="bold" fill="#17365b">Management Cluster Bootstrap</text><text x="500" y="72" font-size="17" fill="#56748b">Logical layers, not a deployment sequence</text><rect x="50.0" y="100" width="440.0" height="74" rx="12" fill="#e9f5ff" stroke="#92c4eb" stroke-width="1.5"/><text x="270.0" y="129" font-size="19" font-weight="bold" fill="#17365b">Local kind</text><text x="270.0" y="153" font-size="14" fill="#526e82">Development and E2E</text><rect x="510.0" y="100" width="440.0" height="74" rx="12" fill="#e9f5ff" stroke="#92c4eb" stroke-width="1.5"/><text x="730.0" y="129" font-size="19" font-weight="bold" fill="#17365b">Existing Kubernetes</text><text x="730.0" y="153" font-size="14" fill="#526e82">Dedicated management option</text><path d="M500 174V199" stroke="#438fc2" stroke-width="2" marker-end="url(#a)"/><rect x="50.0" y="204" width="900.0" height="74" rx="12" fill="#e8faf4" stroke="#82d3c1" stroke-width="1.5"/><text x="500.0" y="233" font-size="19" font-weight="bold" fill="#17365b">Native CAPI foundation</text><text x="500.0" y="257" font-size="14" fill="#526e82">Core, kubeadm providers, CRDs and certificates</text><path d="M500 278V303" stroke="#438fc2" stroke-width="2" marker-end="url(#a)"/><rect x="50.0" y="308" width="900.0" height="74" rx="12" fill="#e9f5ff" stroke="#92c4eb" stroke-width="1.5"/><text x="500.0" y="337" font-size="19" font-weight="bold" fill="#17365b">OpenKubes BYOH</text><text x="500.0" y="361" font-size="14" fill="#526e82">Verified controller, CRDs and agent artifacts</text><path d="M500 382V407" stroke="#438fc2" stroke-width="2" marker-end="url(#a)"/><rect x="50.0" y="412" width="900.0" height="74" rx="12" fill="#e8faf4" stroke="#82d3c1" stroke-width="1.5"/><text x="500.0" y="441" font-size="19" font-weight="bold" fill="#17365b">Optional lifecycle extensions</text><text x="500.0" y="465" font-size="14" fill="#526e82">Runtime Extension, Guard, registry and authorization</text></g></svg>