<rect x="35" y="615" width="1130" height="233" rx="18" fill="#f2fcf8" stroke="#b6e4d8"/><text x="60" y="645" class="l">EXISTING LINUX HOST · VM OR BARE METAL</text>
<rect x="75" y="664" width="1045" height="72" rx="12" class="m"/><text x="597" y="694" text-anchor="middle" class="h">BYOH Host Agent / In-Place Executor</text><text x="597" y="718" text-anchor="middle" class="s">Verified packages · kubeadm upgrade · kubelet upgrade · persistent checkpoints</text>
<path d="M332 538V661" class="p"/><text x="345" y="601" class="s">Watch request</text><path d="M862 664V541" class="q"/><text x="875" y="601" class="s">Report status</text>
