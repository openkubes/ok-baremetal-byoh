<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Lifecycle Execution and Safety Architecture</title><desc id="desc">Cluster API and Runtime Extension coordinate an in-place upgrade through the management API. The guard enforces admission policies using grants. The host agent executes approved requests and reports status.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3888c9"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#159e91"/></marker><style>text{font-family:Arial,sans-serif;fill:#163354} .h{font-size:23px;font-weight:bold}.s{font-size:16px;fill:#50667b}.l{font-size:15px;font-weight:bold;fill:#326b9b}.b{fill:#edf6ff;stroke:#99c8ed;stroke-width:1.7}.m{fill:#eafaf5;stroke:#84d5c5;stroke-width:1.7}.w{fill:white;stroke:#b9d7e9;stroke-width:1.5}.p{fill:none;stroke:#3888c9;stroke-width:2.2;marker-end:url(#a)}.q{fill:none;stroke:#159e91;stroke-width:2.2;marker-end:url(#g)} </style></defs>
<rect width="1200" height="900" rx="20" fill="#fcfeff"/><text x="600" y="48" text-anchor="middle" font-size="33" font-weight="bold">Lifecycle Execution &amp; Safety Architecture</text><text x="600" y="77" text-anchor="middle" class="s">Separate orchestration, authorization, enforcement and host execution</text>
<rect x="35" y="102" width="1130" height="480" rx="18" fill="#f5faff" stroke="#c6deef"/><text x="60" y="132" class="l">MANAGEMENT CLUSTER</text>
<rect x="75" y="150" width="510" height="70" rx="12" class="w"/><text x="330" y="179" text-anchor="middle" class="h">Cluster API</text><text x="330" y="202" text-anchor="middle" class="s">KCP / MachineDeployment version intent</text>
<rect x="75" y="268" width="510" height="85" rx="12" class="b"/><text x="330" y="300" text-anchor="middle" class="h">OpenKubes Runtime Extension</text><text x="330" y="326" text-anchor="middle" class="s">Eligibility · identity checks · drain · verification</text>
<path d="M330 220V265" class="p"/><text x="344" y="247" class="s">RuntimeSDK hooks</text>
<rect x="700" y="150" width="420" height="70" rx="12" fill="#fff7e8" stroke="#e6c78b"/><text x="910" y="179" text-anchor="middle" class="h">Operator authorization</text><text x="910" y="202" text-anchor="middle" class="s">Upgrade Grants · individual host approvals</text>
<rect x="700" y="268" width="420" height="85" rx="12" class="m"/><text x="910" y="300" text-anchor="middle" class="h">No-Replacement Guard</text><text x="910" y="326" text-anchor="middle" class="s">Admission checks · protected transitions</text>
<path d="M910 220V265" class="q"/><text x="924" y="247" class="s">Grant policy</text>
<rect x="75" y="402" width="1045" height="136" rx="13" class="w"/><text x="597" y="428" text-anchor="middle" class="h">Management Kubernetes API</text>
<rect x="105" y="449" width="455" height="67" rx="10" class="b"/><text x="332" y="475" text-anchor="middle" font-size="19" font-weight="bold">ByoHost.spec.inPlaceUpgrade</text><text x="332" y="499" text-anchor="middle" class="s">UID-bound request · target · attempt</text>
<rect x="635" y="449" width="455" height="67" rx="10" class="m"/><text x="862" y="475" text-anchor="middle" font-size="19" font-weight="bold">ByoHost.status.inPlaceUpgrade</text><text x="862" y="499" text-anchor="middle" class="s">Phase · observed versions · step result</text>
