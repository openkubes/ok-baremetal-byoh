<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc">
<title id="title">Cluster API Resource Model</title><desc id="desc">Cluster references its control plane and ByoCluster. Control plane and worker reconciliation create Machines with ByoMachine infrastructure. Registered ByoHosts are selected and assigned. Host agents bootstrap Nodes in the workload cluster.</desc>
