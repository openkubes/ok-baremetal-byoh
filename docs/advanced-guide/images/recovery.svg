<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="title"><title id="title">Checkpoint-Based Forward Recovery</title><rect width="900" height="570" rx="20" fill="#f5fbff"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="450" y="45" font-size="26" font-weight="bold" fill="#17365b">Checkpoint-Based Forward Recovery</text><rect x="130" y="78" width="640" height="83" rx="14" fill="#eaf4ff" stroke="#8dc9d4" stroke-width="2"/><text x="450" y="110" font-size="21" font-weight="bold" fill="#17365b">Failure detected</text><text x="450" y="135" font-size="16" fill="#526b80">Stop new host approvals</text><path d="M450 161v25m-6 -7l6 7 6 -7" fill="none" stroke="#378fc1" stroke-width="2.5"/><rect x="130" y="194" width="640" height="83" rx="14" fill="#edf9fc" stroke="#8dc9d4" stroke-width="2"/><text x="450" y="226" font-size="21" font-weight="bold" fill="#17365b">Diagnose and preserve evidence</text><text x="450" y="251" font-size="16" fill="#526b80">Conditions / journals / actual versions</text><path d="M450 277v25m-6 -7l6 7 6 -7" fill="none" stroke="#378fc1" stroke-width="2.5"/><rect x="130" y="310" width="640" height="83" rx="14" fill="#eafaf5" stroke="#8dc9d4" stroke-width="2"/><text x="450" y="342" font-size="21" font-weight="bold" fill="#17365b">Authorize minimal forward fix</text><text x="450" y="367" font-size="16" fill="#526b80">Check transient command and attempt state</text><path d="M450 393v25m-6 -7l6 7 6 -7" fill="none" stroke="#378fc1" stroke-width="2.5"/><rect x="130" y="426" width="640" height="83" rx="14" fill="#e4f8f2" stroke="#8dc9d4" stroke-width="2"/><text x="450" y="458" font-size="21" font-weight="bold" fill="#17365b">Resume and verify</text><text x="450" y="483" font-size="16" fill="#526b80">Persistent checkpoint / health / identity</text></g></svg>