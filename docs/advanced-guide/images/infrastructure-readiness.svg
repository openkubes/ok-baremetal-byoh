<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 561" role="img" aria-labelledby="title desc"><title id="title">Infrastructure Readiness Model</title><desc id="desc">Common host readiness prerequisites for virtual and physical Linux hosts: OS and compute, storage, network and DNS, identity and time, runtime baseline, and artifacts and trust.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#438fc2"/></marker></defs><rect width="1000" height="561" rx="18" fill="#f5fbfd"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="43" font-size="30" font-weight="bold" fill="#17365b">Infrastructure Readiness Model</text><text x="500" y="72" font-size="17" fill="#56748b">Common prerequisites for virtual and physical Linux hosts</text><rect x="50.0" y="100" width="440.0" height="74" rx="12" fill="#e9f5ff" stroke="#92c4eb" stroke-width="1.5"/><text x="270.0" y="129" font-size="19" font-weight="bold" fill="#17365b">Virtual Machines</text><text x="270.0" y="153" font-size="14" fill="#526e82">Existing virtual hosts</text><rect x="510.0" y="100" width="440.0" height="74" rx="12" fill="#e9f5ff" stroke="#92c4eb" stroke-width="1.5"/><text x="730.0" y="129" font-size="19" font-weight="bold" fill="#17365b">Bare-Metal Hosts</text><text x="730.0" y="153" font-size="14" fill="#526e82">Existing physical hosts</text><path d="M500 174V199" stroke="#438fc2" stroke-width="2" marker-end="url(#a)"/><rect x="50.0" y="204" width="286.6666666666667" height="74" rx="12" fill="#e8faf4" stroke="#82d3c1" stroke-width="1.5"/><text x="193.33333333333334" y="233" font-size="19" font-weight="bold" fill="#17365b">OS &amp; compute</text><text x="193.33333333333334" y="257" font-size="14" fill="#526e82">Supported Linux and sizing</text><rect x="356.6666666666667" y="204" width="286.6666666666667" height="74" rx="12" fill="#e8faf4" stroke="#82d3c1" stroke-width="1.5"/><text x="500.0" y="233" font-size="19" font-weight="bold" fill="#17365b">Storage</text><text x="500.0" y="257" font-size="14" fill="#526e82">Reliable capacity</text><rect x="663.3333333333334" y="204" width="286.6666666666667" height="74" rx="12" fill="#e8faf4" stroke="#82d3c1" stroke-width="1.5"/><text x="806.6666666666667" y="233" font-size="19" font-weight="bold" fill="#17365b">Network &amp; DNS</text><text x="806.6666666666667" y="257" font-size="14" fill="#526e82">Reachable and routable</text><path d="M500 278V303" stroke="#438fc2" stroke-width="2" marker-end="url(#a)"/><rect x="50.0" y="308" width="286.6666666666667" height="74" rx="12" fill="#e9f5ff" stroke="#92c4eb" stroke-width="1.5"/><text x="193.33333333333334" y="337" font-size="19" font-weight="bold" fill="#17365b">Identity &amp; time</text><text x="193.33333333333334" y="361" font-size="14" fill="#526e82">Unique name and clock</text><rect x="356.6666666666667" y="308" width="286.6666666666667" height="74" rx="12" fill="#e9f5ff" stroke="#92c4eb" stroke-width="1.5"/><text x="500.0" y="337" font-size="19" font-weight="bold" fill="#17365b">Runtime baseline</text><text x="500.0" y="361" font-size="14" fill="#526e82">Compatible host state</text><rect x="663.3333333333334" y="308" width="286.6666666666667" height="74" rx="12" fill="#e9f5ff" stroke="#92c4eb" stroke-width="1.5"/><text x="806.6666666666667" y="337" font-size="19" font-weight="bold" fill="#17365b">Artifacts &amp; trust</text><text x="806.6666666666667" y="361" font-size="14" fill="#526e82">Verified sources and access</text><path d="M500 382V407" stroke="#438fc2" stroke-width="2" marker-end="url(#a)"/><rect x="50.0" y="412" width="900.0" height="74" rx="12" fill="#e8faf4" stroke="#82d3c1" stroke-width="1.5"/><text x="500.0" y="441" font-size="19" font-weight="bold" fill="#17365b">Ready for enrollment</text><text x="500.0" y="465" font-size="14" fill="#526e82">Verify all applicable requirements</text></g></svg>