<svg xmlns="http://www.w3.org/2000/svg" width="1448" height="1000" viewBox="0 90 1448 1000" role="img" aria-labelledby="title desc">
  <title id="title">OpenKubes Infrastructure Independence – Virtual Machines and Bare-Metal Hosts</title>
  <desc id="desc">A light OpenKubes-themed architecture diagram showing that infrastructure provisioning is separate from Kubernetes lifecycle management. Provisioning tools feed existing virtual machines and bare-metal hosts into a BYOH host capacity pool, which OpenKubes BYOH and Cluster API use to manage the Kubernetes lifecycle.</desc>

  <defs>
    <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#f4f9ff"/>
    </linearGradient>
    <linearGradient id="mintBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eefbf9"/>
      <stop offset="100%" stop-color="#f5fffd"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#f6fbff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#9ec8ea" flood-opacity="0.20"/>
    </filter>
    <style>
      .navy{fill:#11255f}
      .gray{fill:#596278}
      .softGray{fill:#6f788f}
      .line{stroke:#2b82eb;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .borderBlue{stroke:#96c8f6;stroke-width:3}
      .borderMint{stroke:#88dfd0;stroke-width:3}
      .panelWhite{fill:#ffffff}
      .panelBlue{fill:#f8fcff}
      .panelMint{fill:#f9fffd}
      .pill{fill:#ffffff;stroke:#94c3f0;stroke-width:2.4}
      .divider{stroke:#9fcbef;stroke-width:2.4}
      .t{font-family:Inter, Arial, Helvetica, sans-serif}
      .title{font-weight:800;font-size:33px}
      .subtitle{font-weight:400;font-size:27px}
      .head{font-weight:800;font-size:36px}
      .subhead{font-weight:400;font-size:19px}
      .micro{font-weight:500;font-size:20px}
      .barTitle{font-weight:800;font-size:29px}
      .barText{font-weight:400;font-size:19px}
      .pillText{font-weight:700;font-size:19px}
    </style>
    <marker id="arrowTip" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2b82eb"/>
    </marker>
  </defs>

  <rect width="1448" height="1086" fill="url(#bgFade)"/>

  <!-- background corner decoration -->
  <path d="M1448 0H1300c25 46 60 76 108 98 20 9 30 15 40 31V0z" fill="#d2f5ef" opacity="0.9"/>
  <path d="M1448 0H1366c21 37 54 59 94 77 12 6 31 14 42 28V0z" fill="#b8eee6" opacity="0.95"/>
  <path d="M0 1086h124c-30-44-63-70-106-89-7-3-12-6-18-12v101z" fill="#d1f4ee" opacity="0.9"/>
  <path d="M0 1086h84c-14-24-35-44-66-58-5-3-12-7-18-12v70z" fill="#b8eee6" opacity="0.95"/>

    <text class="t navy title" x="724" y="154" text-anchor="middle">Infrastructure Independence – Virtual Machines and Bare-Metal Hosts</text>
  <text class="t gray subtitle" x="724" y="208" text-anchor="middle">Infrastructure provisioning and Kubernetes lifecycle management are separate concerns</text>

  <!-- provisioning bar -->
  <g filter="url(#shadow)">
    <rect x="57" y="257" rx="22" ry="22" width="1334" height="106" class="panelWhite borderBlue"/>
  </g>
  <text class="t navy barTitle" x="97" y="308">Infrastructure Provisioning</text>
  <text class="t gray barText" x="97" y="338">External to BYOH · choose your own tools</text>
  <line x1="526" y1="281" x2="526" y2="339" class="divider"/>

  <!-- pills -->
  <g>
    <rect x="555" y="282" width="186" height="56" rx="17" class="pill"/>
    <g transform="translate(578 296)">
      <polygon points="14,0 28,8 28,24 14,32 0,24 0,8" fill="none" stroke="#1875e4" stroke-width="2.8"/>
      <line x1="14" y1="0" x2="14" y2="32" stroke="#1875e4" stroke-width="2.8"/>
      <line x1="0" y1="8" x2="28" y2="24" stroke="#1875e4" stroke-width="2.8" opacity="0.7"/>
    </g>
    <text class="t navy pillText" x="670" y="318" text-anchor="middle">OpenTofu</text>

    <rect x="757" y="282" width="186" height="56" rx="17" class="pill"/>
    <g transform="translate(783 296)">
      <polygon points="0,0 14,8 14,24 0,16" fill="#7d4af2"/>
      <polygon points="18,8 32,0 32,16 18,24" fill="#b38cfb"/>
      <polygon points="0,16 14,24 32,24 18,16" fill="#6233db"/>
    </g>
    <text class="t navy pillText" x="870" y="318" text-anchor="middle">Terraform</text>

    <rect x="959" y="282" width="186" height="56" rx="17" class="pill"/>
    <g transform="translate(987 296)">
      <circle cx="16" cy="16" r="15" fill="#1f5fb6"/>
      <text class="t" x="16" y="21" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">A</text>
    </g>
    <text class="t navy pillText" x="1073" y="318" text-anchor="middle">Ansible</text>

    <rect x="1161" y="282" width="198" height="56" rx="17" class="pill"/>
    <g transform="translate(1184 297)" fill="none" stroke="#1875e4" stroke-width="2.6">
      <rect x="0" y="0" width="32" height="11" rx="4"/>
      <rect x="0" y="18" width="32" height="11" rx="4"/>
      <circle cx="8" cy="5.5" r="1.5" fill="#1875e4" stroke="none"/>
      <circle cx="8" cy="23.5" r="1.5" fill="#1875e4" stroke="none"/>
    </g>
    <text class="t navy pillText" x="1280" y="318" text-anchor="middle">Existing Hosts</text>
  </g>

  <!-- branching arrows -->
  <path d="M495 363 V392 H387 V417" class="line" marker-end="url(#arrowTip)"/>
  <path d="M964 363 V392 H1065 V417" class="line" marker-end="url(#arrowTip)"/>

  <!-- vm / bm cards -->
  <g filter="url(#shadow)">
    <rect x="150" y="430" width="545" height="170" rx="24" fill="#f7fcff" class="borderBlue"/>
    <rect x="752" y="430" width="545" height="170" rx="24" fill="#fbfffe" class="borderMint"/>
  </g>

  <!-- vm icon -->
  <g transform="translate(178 472)">
    <g fill="none" stroke="#0f5ea8" stroke-width="3.6">
      <rect x="0" y="0" width="72" height="30" rx="10"/>
      <rect x="0" y="40" width="72" height="30" rx="10"/>
      <rect x="0" y="80" width="72" height="30" rx="10"/>
    </g>
    <circle cx="17" cy="15" r="3.5" fill="#1bd3b5"/>
    <circle cx="30" cy="15" r="3.5" fill="#8cd9ff"/>
    <circle cx="17" cy="55" r="3.5" fill="#1bd3b5"/>
    <circle cx="30" cy="55" r="3.5" fill="#8cd9ff"/>
    <circle cx="17" cy="95" r="3.5" fill="#1bd3b5"/>
    <circle cx="30" cy="95" r="3.5" fill="#8cd9ff"/>
    <polygon points="10,118 82,118 44,138" fill="#bcefeb"/>
  </g>
  <line x1="309" y1="470" x2="309" y2="560" class="divider"/>
  <text class="t navy head" x="342" y="490">Virtual Machines</text>
  <text class="t gray subhead" x="342" y="536">Existing Linux VMs</text>
  <text class="t gray subhead" x="342" y="576">Independent of hypervisor</text>

  <!-- bare metal icon -->
  <g transform="translate(799 476)" fill="none" stroke-width="3.6">
    <rect x="0" y="0" width="96" height="24" rx="10" stroke="#118b96"/>
    <rect x="0" y="41" width="96" height="24" rx="10" stroke="#11a9a0"/>
    <rect x="0" y="82" width="96" height="24" rx="10" stroke="#1cc2a5"/>
    <circle cx="74" cy="12" r="3.5" fill="#1bd3b5" stroke="none"/>
    <circle cx="74" cy="53" r="3.5" fill="#1bd3b5" stroke="none"/>
    <circle cx="74" cy="94" r="3.5" fill="#1bd3b5" stroke="none"/>
  </g>
  <line x1="935" y1="470" x2="935" y2="560" stroke="#9fded4" stroke-width="2.4"/>
  <text class="t navy head" x="972" y="490">Bare-Metal Hosts</text>
  <text class="t gray subhead" x="972" y="536">Existing physical servers</text>
  <text class="t gray subhead" x="972" y="576">Independent of hardware vendor</text>

  <!-- merge arrows -->
  <path d="M423 600 V642 H724 V664" class="line"/>
  <path d="M1024 600 V642 H724 V664" class="line" marker-end="url(#arrowTip)"/>

  <!-- capacity pool -->
  <g filter="url(#shadow)">
    <rect x="215" y="689" width="1018" height="113" rx="24" fill="url(#mintBar)" class="borderMint"/>
  </g>
  <g transform="translate(341 724)">
    <polygon points="34,0 68,17 34,34 0,17" fill="none" stroke="#0fb7bb" stroke-width="3.6"/>
    <polygon points="34,22 68,39 34,56 0,39" fill="none" stroke="#1aa9cf" stroke-width="3.6"/>
    <polygon points="34,44 68,61 34,78 0,61" fill="#1ba8df" opacity="0.95" stroke="#108ebd" stroke-width="3.2"/>
    <polygon points="34,22 68,39 34,56 0,39" fill="#71edd3" opacity="0.55"/>
    <polygon points="34,0 68,17 34,34 0,17" fill="#d5fbf1" opacity="0.9"/>
  </g>
  <line x1="469" y1="719" x2="469" y2="778" stroke="#8bded0" stroke-width="2.4"/>
  <text class="t navy barTitle" x="519" y="744">BYOH Host Capacity Pool</text>
  <text class="t gray barText" x="519" y="782">Registered ByoHosts · namespace-scoped · selectable capacity</text>

  <path d="M724 802 V845" class="line" marker-end="url(#arrowTip)"/>

  <!-- BYOH + CAPI -->
  <g filter="url(#shadow)">
    <rect x="204" y="860" width="1039" height="108" rx="24" fill="url(#blueBar)" class="borderBlue"/>
  </g>
  <g transform="translate(325 892)">
    <polygon points="27,0 54,15 54,45 27,60 0,45 0,15" fill="#ffffff" stroke="#1467e5" stroke-width="4"/>
    <polygon points="27,60 54,45 54,15 27,30" fill="#1bd3b5" opacity="0.8"/>
  </g>
  <line x1="448" y1="885" x2="448" y2="943" class="divider"/>
  <text class="t navy barTitle" x="510" y="910">OpenKubes BYOH + Cluster API</text>
  <text class="t gray barText" x="510" y="948">Declarative Machines · registration · bootstrap · operations · upgrades</text>

  <path d="M724 968 V992" class="line" marker-end="url(#arrowTip)"/>

  <!-- bottom lifecycle -->
  <g filter="url(#shadow)">
    <rect x="204" y="1001" width="1039" height="78" rx="24" fill="#fbfdff" class="borderBlue"/>
  </g>
  <g transform="translate(335 1016)">
    <circle cx="24" cy="24" r="24" fill="#1467e5" opacity="0.96"/>
    <circle cx="24" cy="24" r="11" fill="none" stroke="#ffffff" stroke-width="3.2"/>
    <g stroke="#ffffff" stroke-width="3.2" stroke-linecap="round">
      <line x1="24" y1="0" x2="24" y2="10"/>
      <line x1="24" y1="38" x2="24" y2="48"/>
      <line x1="0" y1="24" x2="10" y2="24"/>
      <line x1="38" y1="24" x2="48" y2="24"/>
      <line x1="7" y1="7" x2="13" y2="13"/>
      <line x1="35" y1="35" x2="41" y2="41"/>
      <line x1="35" y1="13" x2="41" y2="7"/>
      <line x1="7" y1="41" x2="13" y2="35"/>
    </g>
  </g>
  <line x1="455" y1="1022" x2="455" y2="1060" class="divider"/>
  <text class="t navy barTitle" x="534" y="1048">Kubernetes Lifecycle Management</text>
</svg>
