<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 457" role="img" aria-labelledby="title desc"><title id="title">Artifact Provenance</title><desc id="desc">Artifact provenance chain from reviewed Git source through verified build and digest lock to approved deployment, with running identities and script hashes observed and recorded.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#438fc2"/></marker></defs><rect width="1000" height="457" rx="18" fill="#f5fbfd"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="43" font-size="30" font-weight="bold" fill="#17365b">Artifact Provenance</text><text x="500" y="72" font-size="17" fill="#56748b">From reviewed source to observed deployment</text><rect x="50.0" y="100" width="286.6666666666667" height="74" rx="12" fill="#e9f5ff" stroke="#92c4eb" stroke-width="1.5"/><text x="193.33333333333334" y="129" font-size="19" font-weight="bold" fill="#17365b">Source</text><text x="193.33333333333334" y="153" font-size="14" fill="#526e82">Git commit</text><rect x="356.6666666666667" y="100" width="286.6666666666667" height="74" rx="12" fill="#e9f5ff" stroke="#92c4eb" stroke-width="1.5"/><text x="500.0" y="129" font-size="19" font-weight="bold" fill="#17365b">Build</text><text x="500.0" y="153" font-size="14" fill="#526e82">Verified artifact</text><rect x="663.3333333333334" y="100" width="286.6666666666667" height="74" rx="12" fill="#e9f5ff" stroke="#92c4eb" stroke-width="1.5"/><text x="806.6666666666667" y="129" font-size="19" font-weight="bold" fill="#17365b">Lock</text><text x="806.6666666666667" y="153" font-size="14" fill="#526e82">Digest / SHA-256</text><path d="M500 174V199" stroke="#438fc2" stroke-width="2" marker-end="url(#a)"/><rect x="50.0" y="204" width="900.0" height="74" rx="12" fill="#e8faf4" stroke="#82d3c1" stroke-width="1.5"/><text x="500.0" y="233" font-size="19" font-weight="bold" fill="#17365b">Deploy</text><text x