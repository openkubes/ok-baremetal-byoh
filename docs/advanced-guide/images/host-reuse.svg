<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="title desc"><title id="title">Controlled Host Reuse — Proposed Workflow</title><desc id="desc">Proposed controlled host reuse: independent backup and decommission, native teardown and reset, unregister and cleanup, then re-register and provision with a new cluster identity.</desc><rect width="900" height="570" rx="20" fill="#f5fbff"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="450" y="45" font-size="26" font-weight="bold" fill="#17365b">Controlled Host Reuse — Proposed Workflow</text><rect x="130" y="78" width="640" height="83" rx="14" fill="#eaf4ff" stroke="#8dc9d4" stroke-width="2"/><text x="450" y="110" font-size="21" font-weight="bold" fill="#17365b">Independent backup and decommission</text><text x="450" y="135" font-size="16" fill="#526b80">Explicit authorization / protection exit</text><path d="M450 161v25m-6 -7l6 7 6 -7" fill="none" stroke="#378fc1" stroke-width="2.5"/><rect x="130" y="194" width="640" height="83" rx="14" fill="#edf9fc" stroke="#8dc9d4" stroke-width="2"/><text x="450" y="226" font-size="21" font-weight="bold" fill="#17365b">Native teardown and reset</text><text x="450" y="251" font-size="16" fill="#526b80">Wait for assignment release</text><path d="M450 277v25m-6 -7l6 7 6 -7" fill="none" stroke="#378fc1" stroke-width="2.5"/><rect x="130" y="310" width="640" height="83" rx="14" fill="#eafaf5" stroke="#8dc9d4" stroke-width="2"/><text x="450" y="342" font-size="21" font-weight="bold" fill="#17365b">Unregister and cleanup</text><text x="450" y="367" font-size="16" fill="#526b80">Verify credential handling and clean baseline</text><path d="M450 393v25m-6 -7l6 7 6 -7" fill="none" stroke="#378fc1" stroke-width="2.5"/><rect x="130" y="426" width="640" height="83" rx="14" fill="#e4f8f2" stroke="#8dc9d4" stroke-width="2"/><text x="450" y="458" font-size="21" font-weight="bold" fill="#17365b">Re-register and provision</text><text x="450" y="483" font-size="16" fill="#526b80">Same infrastructure / new cluster identity</text></g></svg>