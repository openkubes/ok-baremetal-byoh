<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><!-- Copyright 2026 The OpenKubes Authors. SPDX-License-Identifier: Apache-2.0 --><metadata>Copyright 2026 The OpenKubes Authors. SPDX-License-Identifier: Apache-2.0. Licensed under the Apache License, Version 2.0.</metadata>
<title id="title">BYOH Host Registration, Identity &amp; Trust</title><desc id="desc">Administrator creates bootstrap credentials, host submits a CSR, approval and signing establish a client identity, and host registers in its namespace.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f5faff"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2183db"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#102b57}.h{font-size:30px;font-weight:700}.sub{font-size:18px;fill:#53667d}.lane{font-size:20px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#425b75}.msg{font-size:16px;font-weight:600}.arrow{stroke:#2183db;stroke-width:2;fill:none;marker-end:url(#a)}.life{stroke:#bad5eb;stroke-width:1.6;stroke-dasharray:5 6}.card{fill:white;stroke:#91c8f3;stroke-width:1.7}.mint{fill:#e8faf5;stroke:#6bd4c0;stroke-width:1.7}.num{fill:#1677d2}.n{fill:white;font-size:14px;font-weight:700;text-anchor:middle}</style></defs>
<rect width="1200" height="830" rx="18" fill="url(#bg)"/><path d="M1070 0H1200V108Q1110 78 1070 0" fill="#d8f7f1"/><path d="M1125 0H1200V62Q1150 42 1125 0" fill="#b6eee4"/>
<text x="600" y="45" text-anchor="middle" class="h">BYOH Host Registration, Identity &amp; Trust</text><text x="600" y="75" text-anchor="middle" class="sub">From temporary bootstrap credentials to an authenticated host identity</text>
<rect x="28" y="104" width="238" height="620" rx="15" fill="#f4f9ff" stroke="#c6dff5"/><rect x="280" y="104" width="565" height="620" rx="15" fill="#f1f8ff" stroke="#a6cff3"/><rect x="859" y="104" width="313" height="620" rx="15" fill="#f0fcf8" stroke="#9bded1"/>
<text x="147" y="137" text-anchor="middle" class="lane">Administrator</text><text x="562" y="137" text-anchor="middle" class="lane">Management Cluster</text><text x="1015" y="137" text-anchor="middle" class="lane">Existing Linux Host</text>
<text x="562" y="158" text-anchor="middle" class="small">Kubernetes API · BYOH Controller · Certificate Signer</text><text x="1015" y="158" text-anchor="middle" class="small">Virtual machine or bare metal</text>
<path class="life" d="M147 170V705M562 170V705M1015 170V705"/>
<rect x="302" y="183" width="520" height="63" rx="11" class="card"/><circle cx="325" cy="202" r="12" class="num"/><text x="325" y="207" class="n">1</text><text x="348" y="208" class="label">Create BootstrapKubeconfig</text><text x="348" y="231" class="small">Controller issues a bootstrap token · expires after 30 min</text><path d="M147 214H302" class="arrow"/>
<path d="M147 280H1015" class="arrow"/><rect x="345" y="256" width="510" height="23" rx="5" fill="#fff"/><text x="600" y="273" text-anchor="middle" class="msg">2 · Securely transfer bootstrap kubeconfig to host</text>
<rect x="880" y="300" width="270" height="64" rx="10" class="mint"/><text x="1015" y="324" class="label" text-anchor="middle">Generate private key</text><text x="1015" y="347" class="small" text-anchor="middle">Host agent retains key locally</text>
<path d="M1015 384H562" class="arrow"/><text x="788" y="376" class="msg" text-anchor="middle">3 · Submit CSR using token</text>
<rect x="302" y="404" width="520" height="77" rx="11" class="card"/><circle cx="325" cy="425" r="12" class="num"/><text x="325" y="430" class="n">4</text><text x="348" y="430" class="label">Validate and approve CSR</text><text x="348" y="452" class="small">Automatic approver OR explicit administrator review</text><text x="348" y="471" class="small">Approved CSR is signed by kube-controller-manager</text><path d="M147 443H302" class="arrow"/><text x="224" y="434" class="small" text-anchor="middle">Manual mode</text>
<path d="M562 507H1015" class="arrow"/><text x="788" y="499" class="msg" text-anchor="middle">5 · Agent retrieves signed certificate</text>
<rect x="880" y="521" width="270" height="71" rx="10" class="mint"/><text x="1015" y="546" class="label" text-anchor="middle">Client identity</text><text x="1015" y="567" class="small" text-anchor="middle">Certificate + private key</text><text x="1015" y="584" class="small" text-anchor="middle">/root/.byoh/config</text>
<path d="M1015 612H562" class="arrow"/><text x="788" y="604" class="msg" text-anchor="middle">6 · Authenticate and register ByoHost</text>
<rect x="302" y="633" width="520" height="72" rx="11" class="mint"/><text x="562" y="659" text-anchor="middle" class="label">Registered ByoHost · Capacity Pool</text><text x="562" y="683" text-anchor="middle" class="small">RBAC + admission checks · namespace-scoped allocation</text>
<rect x="28" y="742" width="1144" height="65" rx="12" fill="#fff" stroke="#c0d9ee"/><text x="600" y="766" text-anchor="middle" class="label">Authentication is not allocation</text><text x="600" y="790" text-anchor="middle" class="small">A registered host is not yet a Kubernetes node. Bootstrap tokens are not currently bound to a specific host.</text>
</svg>
