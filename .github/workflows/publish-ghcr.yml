name: Publish BYOH images to GHCR

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      ${{
        github.repository == 'openkubes/ok-baremetal-byoh' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish candidate images and lock build outputs
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{commit})" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          metadata=$(mktemp -d)
          for name in byoh-controller no-replacement-guard inplace-extension; do
            image="ghcr.io/openkubes/${name}:git-${SOURCE_SHA:0:12}"
            case "$name" in
              byoh-controller) args=(docker-buildx IMG="$image");;
              no-replacement-guard) args=(docker-buildx-guard IMG_GUARD="$image");;
              inplace-extension) args=(docker-buildx-extension IMG_EXTENSION="$image");;
            esac
            make "${args[@]}" IMAGE_PLATFORMS=linux/amd64,linux/arm64 \
              DOCKER_BUILDX_PUSH=true BUILDX_METADATA_FILE="$metadata/$name.json"
          done
          lock="$RUNNER_TEMP/image-lock.json"
          python3 hack/release/image-lock.py create "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$metadata" > "$lock"
          jq -r '.images[].reference' "$lock" >> "$GITHUB_STEP_SUMMARY"

      - name: Save immutable candidate image lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: byoh-image-lock-${{ github.event.workflow_run.head_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-lock.json
          if-no-files-found: error
          retention-days: 90
