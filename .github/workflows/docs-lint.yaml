name: Check Markdown links

on:
  pull_request:
    paths:
      - '**.md'

jobs:
  markdown-link-check:
    name: Broken Links
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: tcort/github-action-markdown-link-check@e047c5b37f24ab722bbef1a27b6fab7f96bc4068 # v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        check-modified-files-only: 'yes'
        base-branch: 'main'
        # markdown.links.config.json ignores https://scaleway.com/ and
        # https://www.scaleway.com/ only: their CDN (BunnyCDN) answers every
        # automated request with 403, also for the home page and for pages
        # that do not exist, so the status says nothing about the link. All
        # other URLs, other Scaleway hosts included, are still checked.
        config-file: '.github/workflows/markdown.links.config.json'
