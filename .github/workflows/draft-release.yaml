name: Draft Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  package:
    if: github.repository == 'openkubes/ok-baremetal-byoh'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Set up read-only registry inspection
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Verify approved source and package release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          inputs=$(bash hack/release/tag-inputs.sh "$GITHUB_REF")
          read -r sha run attempt <<< "$inputs"
          test "$(git rev-parse "$GITHUB_SHA^{commit}")" = "$sha"
          bash hack/release/fetch-image-lock.sh "$sha" "$run" "$attempt" "$RUNNER_TEMP/byoh-lock"
          bash hack/release/package.sh "$sha" "$GITHUB_REF_NAME" "$run" "$attempt" "$RUNNER_TEMP/byoh-lock/image-lock.json" "$RUNNER_TEMP/byoh-release"
          cd "$RUNNER_TEMP/byoh-release"
          sha256sum --check --strict checksums.txt

      - name: Stage audited bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: byoh-release-bundle
          path: ${{ runner.temp }}/byoh-release/
          if-no-files-found: error

  draft:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download audited bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: byoh-release-bundle
          path: _dist

      - name: Recheck staged checksums
        working-directory: _dist
        run: sha256sum --check --strict checksums.txt

      - name: Create the draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          working-directory: _dist
          files: "*"
